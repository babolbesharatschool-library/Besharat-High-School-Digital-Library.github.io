<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کتابخانه دیجیتال دبیرستان بشارت</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #1f4e79;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-top: 12px;
      font-size: 17px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      color: #1f4e79;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #1f4e79;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .button:hover {
      background: #163a5c;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>کتابخانه دیجیتال دبیرستان بشارت</h1>
    <p>مرجع دیجیتال کتاب‌ها و منابع آموزشی مدرسه</p>
  </header>

  <main>
    <section class="welcome">
      <h2>به کتابخانه دیجیتال بشارت خوش آمدید</h2>

      <p>
        در این سامانه می‌توانید به منابع و کتاب‌های دیجیتال
        کتابخانه دبیرستان بشارت دسترسی داشته باشید.
      </p>

      <a class="button" href="#">ورود به کتابخانه</a>
    </section>
  </main>

  <footer>
    کتابخانه دیجیتال دبیرستان بشارت
  </footer>

</body>
</html>
