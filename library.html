<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کتابخانه | دبیرستان بشارت</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #1f4e79;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
    }

    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 20px;
    }

    .book {
      background: white;
      margin-bottom: 20px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .book h2 {
      color: #1f4e79;
      margin-top: 0;
    }

    .book p {
      line-height: 1.9;
    }

    .button {
      display: inline-block;
      padding: 10px 20px;
      background: #1f4e79;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>کتابخانه دیجیتال دبیرستان بشارت</h1>
  <p>منابع و کتاب‌های آموزشی</p>
</header>

<main>

  <div class="book">
    <h2>کتاب‌ها</h2>
    <p>
      در این بخش کتاب‌ها و منابع دیجیتال کتابخانه قرار می‌گیرند.
    </p>

    <a class="button" href="#">مشاهده کتاب‌ها</a>
  </div>

  <div class="book">
    <h2>منابع آموزشی</h2>
    <p>
      فایل‌ها و منابع آموزشی مورد استفاده دانش‌آموزان در این قسمت قرار می‌گیرند.
    </p>

    <a class="button" href="#">مشاهده منابع</a>
  </div>

</main>

<footer>
  کتابخانه دیجیتال دبیرستان بشارت
</footer>

</body>
</html>
