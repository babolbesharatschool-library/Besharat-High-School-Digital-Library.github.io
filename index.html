<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کتابخانه دیجیتال دبیرستان بشارت</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fa;
      color: #222;
      text-align: center;
    }

    header {
      background: #0d3b66;
      color: white;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 12px;
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 45px 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .welcome h2 {
      color: #0d3b66;
      margin-bottom: 20px;
    }

    .welcome p {
      font-size: 17px;
      line-height: 2;
    }

    .library-button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      background: #0d3b66;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 17px;
      transition: 0.2s;
    }

    .library-button:hover {
      background: #145b91;
    }

    footer {
      margin-top: 60px;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>کتابخانه دیجیتال دبیرستان بشارت</h1>
    <p>مرجع دیجیتال کتاب‌ها و منابع آموزشی مدرسه</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>به کتابخانه دیجیتال بشارت خوش آمدید</h2>

      <p>
        در این سامانه می‌توانید به منابع و کتاب‌های دیجیتال
        دبیرستان بشارت دسترسی داشته باشید.
      </p>

      <a href="library.html" class="library-button">
        ورود به کتابخانه
      </a>
    </section>

  </main>

  <footer>
    کتابخانه دیجیتال دبیرستان بشارت
  </footer>

</body>
</html>
